# Build the pkgdown site (including vignettes) in the Bioconductor container and publish it with
# GitHub Pages (source: GitHub Actions). Shares the cached R library with the check workflow.
name: pkgdown
on:
  push: {branches: [main]}
  release: {types: [published]}
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:RELEASE_3_22
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/R/site-library
          key: rlib-pkgdown-bioc3.22-${{ hashFiles('DESCRIPTION') }}
          restore-keys: |
            rlib-pkgdown-bioc3.22-
            rlib-bioc3.22-
      - name: Install dependencies
        run: |
          which pandoc || (apt-get update -qq && apt-get install -y -qq pandoc)
          Rscript -e 'BiocManager::install(c("remotes", "pkgdown", "rtracklayer", "BiocStyle", "knitr", "rmarkdown"), update = FALSE, ask = FALSE)' \
                  -e 'remotes::install_deps(dependencies = "hard", upgrade = "never", repos = BiocManager::repositories())'
          R CMD INSTALL --no-docs --no-multiarch .
      - name: Build site
        run: Rscript -e 'pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pkgdown-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
